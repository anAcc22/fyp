# The heuristics compared at a budget of 128 comparisons per point, about 1.3% of the points.

dimensions     = [4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048]
point_counts   = [10000]
trial_count    = 30
relative_check = true

[[solvers]]
name               = "examine_random_pairs"
attempts_per_point = 128

[[solvers]]
name                 = "examine_neighbours_along_random_directions"
direction_count      = 8
neighbours_per_point = 16

[[solvers]]
name                 = "examine_neighbours_along_z_order_curve"
shift_count          = 8
neighbours_per_point = 16

[[solvers]]
name                  = "best_first_kd_tree"
comparisons_per_point = 128
